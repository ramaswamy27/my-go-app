stack: "go"
stackVersion: "1.22-alpine"
imageName: "my-lightweight-go-app"
imageVer: 2.11.13
resources:
  cpu: "0.7"
  memory: "100Mi"
buildCmd: "export GOCACHE=$WORKSPACE/.go-cache && export GOPATH=$WORKSPACE/.go-path && go mod init my-lightweight-go-app && go build -v -o app-binary ."
testCmd: "export GOCACHE=$WORKSPACE/.go-cache && export GOPATH=$WORKSPACE/.go-path && go test -v ./..."
