dockerImage: "go"
imageVersion: "1.22.-alpine"
finalImageName: "my-lightweight-go-app"
finalImageVer: 2.11.13
resources:
  cpu: "1"
  memory: "300Mi"
buildCmd: "sh -c 'GOCACHE=$WORKSPACE/.go-cache GOPATH=$WORKSPACE/.go-path go get gopkg.in/yaml.v3 && GOCACHE=$WORKSPACE/.go-cache GOPATH=$WORKSPACE/.go-path go build -v -o app-binary .'"
testCmd: "sh -c 'GOCACHE=$WORKSPACE/.go-cache GOPATH=$WORKSPACE/.go-path go test -v ./...'"
